<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    body{
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 0;
    }
    .container{
      display: grid;
      width: 748px;
      grid-template-columns: 320px 198px 153px 1fr;
      grid-template-rows: 414px 130px 155px 22px;
      gap: 9px;
      background-color: black;
    }
    .red{
      background-color: #E72F24;
      
    }
    .plane1{
      background-color: #F0F1EC;
      grid-column: span 3;      
    }
    .plane2{
      background-color: #F0F1EC;
      grid-row: span 2;
    }
    .plane3{
      background-color: #F0F1EC;
      grid-area: 2 / 2 / 4 / 4;   
    }
    .blue{
      background-color: #004592;
      border-bottom: 10px solid black;
    }
    .plane4{
      background-color: #F0F1EC;
      grid-row: span 2;
    }
    .plane5{
      background-color: #F0F1EC;
    }
    .yellow{
      background-color: #F9D01E;
    }
    .black{
      background-color: #232629;
    }
  </style>
</head>

<body>
  <!-- Write your HTML here -->
   <div class="container">
      <div class="gridItem red"></div>
      <div class="gridItem plane1"></div>
      <div class="gridItem plane2"></div>
      <div class="gridItem plane3"></div>
      <div class="gridItem blue"></div>
      <div class="gridItem plane4"></div>
      <div class="gridItem plane5"></div>
      <div class="gridItem yellow"></div>
      <div class="gridItem black"></div>
   </div>
</body>

</html>
